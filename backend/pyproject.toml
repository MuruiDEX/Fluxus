[project]
name = "muse-spark-backend"
version = "0.1.0"
description = "MUSE SPARK — AI Business Office backend (FastAPI foundation, Stage 1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "aiosqlite>=0.19",
  "argon2-cffi>=23.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff==0.17.0",
  # Embedded PostgreSQL binaries for local dev/test when Docker is
  # unavailable (postgresql-binaries 16.x; PG 18.x binaries are broken
  # in this Windows environment — see backend README).
  "postgresql-binaries==16.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One loop for the whole session: asyncpg connections bind futures to the
# creating loop, so fixtures and tests must share it.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerate output: long generated lines are not hand code.
"alembic/versions/*.py" = ["E501"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# The repo root holds several top-level directories (app/, alembic/,
# scripts/, tests/); only app/ is an installable package. Without this,
# setuptools flat-layout discovery fails on `pip install -e .` with
# "Multiple top-level packages discovered".
[tool.setuptools.packages.find]
include = ["app*"]
