services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: muse
      POSTGRES_DB: muse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: muse
      POSTGRES_DB: muse_test
    ports:
      - "5433:5432"
    volumes:
      - ./scripts/init-test-dbs.sh:/docker-entrypoint-initdb.d/init-test-dbs.sh:ro
      - pgtestdata:/var/lib/postgresql/data

volumes:
  pgdata:
  pgtestdata:
